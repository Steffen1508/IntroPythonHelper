<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI-Programmering Exam Prep Helper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<script src="vendor/skulpt.min.js"></script>

<style>
/* Layout: the overview mirrors the lecturer's two-column evaluation sheet (a score box per topic);
   practice is one focused question card; code blocks look like the editor students already use. */
:root {
  --bg: #f2f5f9; --surface: #ffffff; --surface-2: #e8edf4; --ink: #17212d; --muted: #566577; --line: #cdd6e2;
  --accent: #2c5f8f; --accent-ink: #ffffff; --accent-soft: #dce8f4; --mark: #ffd43b; --mark-ink: #3a2f00; --mark-cut: 62%;
  --good: #1b7a45; --good-soft: #dcf0e4; --warn: #8f5b00; --warn-soft: #f7eaca; --bad: #b4372f; --bad-soft: #f8dedb;
  --code-bg: #17212d; --code-ink: #e4ebf3; --code-line: #2b3948;
  --tok-kw: #8fc1f2; --tok-str: #f3d36b; --tok-com: #8b9cae; --tok-num: #f3a183; --tok-fn: #9fdcb7;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #18212b; --surface-2: #222e3b; --ink: #e6edf4; --muted: #9cabbb; --line: #2e3c4c;
    --accent: #74aee3; --accent-ink: #0f151c; --accent-soft: #1d3247; --mark: #ffd43b; --mark-ink: #3a2f00; --mark-cut: 86%;
    --good: #58c990; --good-soft: #173527; --warn: #e6b455; --warn-soft: #3a2d12; --bad: #f08379; --bad-soft: #3f1c1a;
    --code-bg: #0a0f15; --code-ink: #e4ebf3; --code-line: #243140;
    --tok-kw: #8fc1f2; --tok-str: #f3d36b; --tok-com: #8b9cae; --tok-num: #f3a183; --tok-fn: #9fdcb7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212b; --surface-2: #222e3b; --ink: #e6edf4; --muted: #9cabbb; --line: #2e3c4c;
  --accent: #74aee3; --accent-ink: #0f151c; --accent-soft: #1d3247; --mark: #ffd43b; --mark-ink: #3a2f00; --mark-cut: 86%;
  --good: #58c990; --good-soft: #173527; --warn: #e6b455; --warn-soft: #3a2d12; --bad: #f08379; --bad-soft: #3f1c1a;
  --code-bg: #0a0f15; --code-ink: #e4ebf3; --code-line: #243140;
  --tok-kw: #8fc1f2; --tok-str: #f3d36b; --tok-com: #8b9cae; --tok-num: #f3a183; --tok-fn: #9fdcb7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-mono); }
code { background: var(--surface-2); padding: 0.08em 0.36em; border-radius: 4px; font-size: 0.9em; overflow-wrap: anywhere; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--line); }
.brand { padding-bottom: 12px; }
.brand h1 { font-size: 1.5rem; }
.brand h1 span { background: linear-gradient(transparent var(--mark-cut), var(--mark) var(--mark-cut)); }
.brand p { color: var(--muted); font-size: 0.875rem; }
.tabs { display: flex; gap: 4px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--mark); }
main { display: flex; flex-direction: column; gap: 28px; padding-top: 28px; }
.view { display: flex; flex-direction: column; gap: 28px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 11px; font-size: 0.875rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* overview */
.lead { max-width: 66ch; display: flex; flex-direction: column; gap: 10px; }
.lead h2 { font-size: 1.3rem; }
.lead p { color: var(--muted); }
.status { display: flex; flex-direction: column; gap: 12px; }
.meter { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.meter span { display: block; height: 100%; }
.meter .g { background: var(--good); } .meter .w { background: var(--warn); } .meter .b { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.legend i.g { background: var(--good); border-color: var(--good); } .legend i.w { background: var(--warn); border-color: var(--warn); } .legend i.b { background: var(--bad); border-color: var(--bad); }
.weak { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.9rem; }
.weak strong { font-weight: 600; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 0.875rem; }
.chip:hover { border-color: var(--accent); }
.start { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.start h3 { font-size: 1.05rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 0.925rem; }
.opts label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.opts input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
.opts select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; }
.msg { color: var(--bad); font-size: 0.9rem; font-weight: 500; }

.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; }
.sheet-head h2 { font-size: 1.3rem; }
.sheet-head p { color: var(--muted); font-size: 0.875rem; max-width: 60ch; }
.sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 40px; }
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.cat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cat-head h3 { font-size: 1.05rem; flex: 1; min-width: 0; }
.subs { list-style: none; margin: 0; padding: 4px 0 0 18px; display: flex; flex-direction: column; }
.sub { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 6px; padding: 5px 6px; text-align: left; }
.sub:hover { background: var(--surface-2); }
.sub-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sub-count { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.box { flex: none; width: 26px; height: 26px; border: 1.5px solid var(--muted); border-radius: 3px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; }
.box.lv-b { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.box.lv-w { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.box.lv-g { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.hero { display: flex; flex-direction: column; gap: 20px; max-width: 34rem; padding-block: 28px 12px; }
.hero h2 { font-size: 2.1rem; }
.hero p { color: var(--muted); font-size: 1.05rem; }
.btn.big { padding: 14px 44px; font-size: 1.15rem; }
.quiet { gap: 10px 24px; font-size: 0.95rem; }
.settings summary { cursor: pointer; color: var(--muted); font-weight: 500; width: fit-content; }
.settings .opts { padding-top: 12px; }
.cheat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px 24px; align-items: start; }
.cheat-item { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cheat-item h3 { font-size: 1rem; }
.foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; color: var(--muted); font-size: 0.875rem; border-top: 1px solid var(--line); padding-top: 16px; }

/* practice */
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.p-count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.p-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.p-bar span { display: block; height: 100%; background: var(--accent); }
.practice { display: flex; flex-direction: column; gap: 14px; max-width: 820px; width: 100%; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.crumb { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.kind { margin-left: auto; text-transform: none; letter-spacing: 0; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 500; }
.q { font-size: 1.2rem; font-weight: 500; font-family: var(--font-body); line-height: 1.45; }
.q-title { font-size: 1.25rem; }
.q-text { max-width: 68ch; }
.prev { font-size: 0.8rem; color: var(--muted); }
pre.code, pre.out { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 0.875rem; line-height: 1.6; tab-size: 4; }
pre.out { white-space: pre-wrap; overflow-wrap: anywhere; }
pre.out.empty { color: var(--tok-com); font-style: italic; }
.tk-kw { color: var(--tok-kw); } .tk-str { color: var(--tok-str); } .tk-com { color: var(--tok-com); font-style: italic; } .tk-num { color: var(--tok-num); } .tk-fn { color: var(--tok-fn); }
.guess { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 12px; font-family: var(--font-mono); font-size: 0.875rem; }
.field-label { font-size: 0.85rem; color: var(--muted); font-weight: 500; display: block; margin-bottom: 4px; }
.ans { border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.ans-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--muted); }
.expl { max-width: 68ch; }
.verdict { font-weight: 600; padding: 8px 12px; border-radius: 8px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict.info { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.rate { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rate span { font-weight: 600; margin-right: 4px; }
.rate .btn { display: inline-flex; align-items: center; gap: 8px; }
.rate kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: 0.7; }
.btn.r0 { border-color: var(--bad); color: var(--bad); } .btn.r1 { border-color: var(--warn); color: var(--warn); } .btn.r2 { border-color: var(--good); color: var(--good); }
.btn.r0:hover { background: var(--bad-soft); } .btn.r1:hover { background: var(--warn-soft); } .btn.r2:hover { background: var(--good-soft); }
.mc { display: flex; flex-direction: column; gap: 8px; }
.mc button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; }
.mc button:hover:not([disabled]) { border-color: var(--accent); }
.mc button[disabled] { cursor: default; }
.mc .n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.mc .right { border-color: var(--good); background: var(--good-soft); }
.mc .wrong { border-color: var(--bad); background: var(--bad-soft); }
.hint { background: var(--warn-soft); border-radius: 8px; padding: 10px 14px; }
.keys { color: var(--muted); font-size: 0.8rem; text-align: center; }

/* editor */
.editor { display: flex; background: var(--code-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--code-line); }
.editor:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.gutter { flex: none; padding: 12px 8px 12px 12px; color: var(--tok-com); text-align: right; user-select: none; font-family: var(--font-mono); font-size: 0.875rem; line-height: 1.6; white-space: pre; overflow: hidden; border-right: 1px solid var(--code-line); }
.editor textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--code-ink); caret-color: var(--mark); padding: 12px 14px; font-family: var(--font-mono); font-size: 0.875rem; line-height: 1.6; tab-size: 4; white-space: pre; overflow: auto; }
.ed-note { font-size: 0.8rem; color: var(--muted); }

/* summary */
.sum-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.sum-list li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.sum-list .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); transform: translateY(1px); }
.dot.d2 { background: var(--good); border-color: var(--good); } .dot.d1 { background: var(--warn); border-color: var(--warn); } .dot.d0 { background: var(--bad); border-color: var(--bad); }
.sum-list .t { flex: 1; min-width: 0; }
.sum-list .s { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@media (max-width: 720px) {
  .sheet { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .card { padding: 16px; }
  .q { font-size: 1.08rem; }
  .subs { padding-left: 4px; }
  .sum-list .s { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .p-bar span, .meter span { transition: width 0.3s ease; } }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span>Exam Prep Helper</span></h1>
      <p>AI-Programmering, DAKI 1. semester</p>
    </div>
    <nav class="tabs" aria-label="Sider">
      <button class="tab" id="tab-start" data-act="nav" data-to="start">Start</button>
      <button class="tab" id="tab-oev" data-act="nav" data-to="oev">Øv</button>
      <button class="tab" id="tab-oversigt" data-act="nav" data-to="oversigt">Overblik</button>
      <button class="tab" id="tab-cheatsheet" data-act="nav" data-to="cheatsheet">Cheatsheet</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
(function () {
'use strict';
var BANK = {"cats": [{"id": "basics", "name": "Basics", "subs": [{"id": "basics.term", "name": "Terminology"}, {"id": "basics.syntax", "name": "Syntax"}, {"id": "basics.algo", "name": "Algorithms"}, {"id": "basics.indent", "name": "Indents"}]}, {"id": "vars", "name": "Variables and datatypes", "subs": [{"id": "vars.names", "name": "Names (rules, camelCase)"}, {"id": "vars.types", "name": "Types"}, {"id": "vars.scope", "name": "Scope"}, {"id": "vars.assign", "name": "Initialization/assignment"}, {"id": "vars.expr", "name": "Expressions"}, {"id": "vars.bool", "name": "Boolean"}, {"id": "vars.fstr", "name": "f-string"}, {"id": "vars.under", "name": "_ (navn)"}, {"id": "vars.math", "name": "Math operations (also // and %)"}]}, {"id": "pg", "name": "Pygame/PyQt", "subs": [{"id": "pg.coords", "name": "Screen coordinate system"}, {"id": "pg.draw", "name": "Drawing stuff"}]}, {"id": "input", "name": "Mouse/keyboard input", "subs": [{"id": "input.event", "name": "pygame.event"}]}, {"id": "branch", "name": "Branching", "subs": [{"id": "branch.ifelse", "name": "if/else/else if"}, {"id": "branch.boolexp", "name": "Boolean expressions (and/or/not)"}, {"id": "branch.eqeq", "name": "== vs ="}]}, {"id": "loop", "name": "Looping", "subs": [{"id": "loop.forrange", "name": "for in range()"}, {"id": "loop.while", "name": "while"}, {"id": "loop.brk", "name": "break"}, {"id": "loop.cont", "name": "continue"}]}, {"id": "func", "name": "Functions", "subs": [{"id": "func.define", "name": "Calling/declaring/defining"}, {"id": "func.input", "name": "Input"}, {"id": "func.ret", "name": "Return"}, {"id": "func.void", "name": "Void return"}, {"id": "func.local", "name": "Local variables"}, {"id": "func.passby", "name": "Pass-by-value/pass-by-reference"}, {"id": "func.static", "name": "Static methods"}]}, {"id": "cls", "name": "Classes", "subs": [{"id": "cls.clsobj", "name": "Classes vs. objects"}, {"id": "cls.inst", "name": "Instance variables, methods"}, {"id": "cls.ctor", "name": "Constructors"}, {"id": "cls.self", "name": "self"}, {"id": "cls.modules", "name": "Modules"}]}, {"id": "doc", "name": "Documentation/debugging", "subs": [{"id": "doc.comments", "name": "Comments"}, {"id": "doc.pseudo", "name": "Pseudocode"}, {"id": "doc.debug", "name": "Debugging"}, {"id": "doc.exc", "name": "Exceptions"}]}, {"id": "iter", "name": "Iterables", "subs": [{"id": "iter.list", "name": "List"}, {"id": "iter.dict", "name": "Dict"}, {"id": "iter.tuple", "name": "Tuple"}, {"id": "iter.set", "name": "Set"}, {"id": "iter.slice", "name": "Slicing"}, {"id": "iter.comp", "name": "List comprehension"}, {"id": "iter.enum", "name": "Enumerate"}, {"id": "iter.arr2d", "name": "2D arrays"}]}, {"id": "test", "name": "Testing", "subs": [{"id": "test.unit", "name": "Unit testing"}]}], "qs": [{"id": "basics.term#1", "t": "basics.term", "k": "o", "q": "Hvad er forskellen på en `function` og en `method`?", "a": "En `function` står for sig selv og kaldes med sit navn, fx `len(my_list)`. En `method` er en function, der hører til et object og kaldes med punktum, fx `my_list.append(3)`. En method får automatisk objektet selv med som første argument (`self`)."}, {"id": "basics.term#2", "t": "basics.term", "k": "o", "q": "Hvad er forskellen på en `parameter` og et `argument`?", "code": "def greet(name):\n    print(\"Hej\", name)\n\ngreet(\"Ali\")", "a": "En `parameter` er navnet i function definition (`name`). Et `argument` er den konkrete værdi, man sender med, når man kalder funktionen (`\"Ali\"`)."}, {"id": "basics.term#3", "t": "basics.term", "k": "o", "q": "Hvad er forskellen på en `variable` og en `value`?", "a": "En `value` er selve dataen, fx `42` eller `\"hej\"`. En `variable` er et navn, der peger på en value, så man kan bruge den igen senere. I `age = 21` er `age` variablen og `21` værdien."}, {"id": "basics.term#4", "t": "basics.term", "k": "o", "q": "Hvad er et `keyword` i Python? Giv mindst tre eksempler.", "a": "Et `keyword` er et ord, som Python har reserveret til sin egen syntax, så det kan ikke bruges som variable name. Eksempler: `if`, `else`, `for`, `while`, `def`, `class`, `return`, `import`, `True`, `False`, `None`, `and`, `or`, `not`."}, {"id": "basics.term#5", "t": "basics.term", "k": "o", "q": "Hvad vil det sige at \"call\" en function?", "a": "At kalde (call) en function betyder at køre koden inde i den. Det gør man ved at skrive funktionens navn efterfulgt af parenteser, fx `print(\"hej\")` eller `main()`. Uden parenteserne bliver funktionen ikke kørt."}, {"id": "basics.term#6", "t": "basics.term", "k": "m", "q": "Hvad kalder man en fejl i koden, som får programmet til at opføre sig forkert?", "a": "En `bug` er en fejl i programmet. At finde og rette fejl hedder `debugging`.", "opts": ["En `bug`", "En `loop`", "En `string`", "Et `module`"]}, {"id": "basics.term#7", "t": "basics.term", "k": "m", "q": "Hvad er `\"hello\"` i Python?", "a": "Tekst i anførselstegn er en `string` (typen hedder `str`).", "opts": ["En `string`", "En `integer`", "En `variable`", "En `function`"]}, {"id": "basics.term#8", "t": "basics.term", "k": "o", "q": "I udtrykket `a + b`: hvad er `operator`, og hvad er `operands`?", "a": "`+` er `operator` (det, der udfører en handling). `a` og `b` er `operands` (de værdier, operatoren arbejder på)."}, {"id": "basics.term#9", "t": "basics.term", "k": "o", "q": "Hvad er et `library` (eller `package`)? Nævn et, du har brugt i kurset.", "a": "Et `library` er kode, som andre har skrevet, og som man kan importere og bruge i sit eget program, så man ikke skal skrive alt selv. Eksempler fra kurset: `pygame`, `PyQt6`, `math`, `random`."}, {"id": "basics.term#10", "t": "basics.term", "k": "o", "q": "Hvad betyder `iteration`?", "a": "En `iteration` er ét gennemløb af et loop. Hvis `for i in range(5)` kører 5 gange, har loopet 5 iterations. At \"iterate over\" en list betyder at gå igennem elementerne ét ad gangen."}, {"id": "basics.term#11", "t": "basics.term", "k": "o", "q": "Hvad er et `index`?", "a": "Et `index` er positionen af et element i fx en `list` eller `string`. Python starter med index `0`, så i `names = [\"Ali\", \"Bo\"]` er `names[0]` lig `\"Ali\"`."}, {"id": "basics.term#12", "t": "basics.term", "k": "m", "q": "I `print(\"Hej\")`: hvad er `\"Hej\"`?", "a": "`\"Hej\"` er den værdi, vi sender med til `print`, altså et `argument`.", "opts": ["Et `argument`", "En `parameter`", "En `method`", "Et `keyword`"]}, {"id": "basics.term#13", "t": "basics.term", "k": "o", "q": "Hvad er forskellen på en `string`, en `integer` og en `float`?", "a": "En `string` (`str`) er tekst, fx `\"hej\"`. En `integer` (`int`) er et heltal, fx `7`. En `float` er et decimaltal, fx `7.5`. Bemærk at Python bruger punktum og ikke komma i decimaltal."}, {"id": "basics.syntax#1", "t": "basics.syntax", "k": "o", "q": "Hvad betyder `syntax`?", "a": "`Syntax` er reglerne for, hvordan koden skal skrives, for at Python kan forstå den. Det svarer til grammatik i et sprog. Bryder man reglerne, får man en `SyntaxError`, og programmet starter slet ikke."}, {"id": "basics.syntax#2", "t": "basics.syntax", "k": "m", "q": "Hvilken linje er gyldig Python?", "a": "En `if` statement skal slutte med kolon, bruger `==` til sammenligning og bruger indentation i stedet for `{ }`.", "opts": ["`if x == 5:`", "`if x == 5 then`", "`if (x == 5) {`", "`if x = 5:`"]}, {"id": "basics.syntax#3", "t": "basics.syntax", "k": "o", "q": "Hvad bruges kolon `:` til i Python?", "a": "Kolon afslutter den linje, der starter en block: `if`, `elif`, `else`, `for`, `while`, `def`, `class`, `try` og `except`. Linjerne efter kolon skal være indented. (Kolon bruges også i slicing og i dictionaries.)"}, {"id": "basics.syntax#4", "t": "basics.syntax", "k": "m", "q": "Hvordan skriver man en `comment` i Python?", "a": "En comment starter med `#` og fortsætter til slutningen af linjen.", "opts": ["`# dette er en comment`", "`// dette er en comment`", "`<!-- dette er en comment -->`", "`** dette er en comment`"]}, {"id": "basics.syntax#5", "t": "basics.syntax", "k": "o", "q": "Er Python `case sensitive`? Hvad betyder det i praksis?", "a": "Ja. Store og små bogstaver er forskellige. `Print(\"hej\")` giver en `NameError`, fordi funktionen hedder `print`. På samme måde er `name` og `Name` to forskellige variabler."}, {"id": "basics.syntax#6", "t": "basics.syntax", "k": "m", "q": "Hvilken fejl får man, hvis man glemmer en afsluttende parentes?", "code": "print(\"Hej\"", "a": "Koden bryder sprogets regler, så Python kan slet ikke læse den. Det er en `SyntaxError`.", "opts": ["`SyntaxError`", "`NameError`", "`TypeError`", "`ValueError`"]}, {"id": "basics.syntax#7", "t": "basics.syntax", "k": "o", "q": "Der er to syntax errors i denne kode. Find dem.", "code": "def greet(name)\n    print(\"Hej \" + name\ngreet(\"Ali\")", "a": "1. Der mangler kolon efter `def greet(name)`.\n2. Der mangler en afsluttende parentes i `print(\"Hej \" + name)`."}, {"id": "basics.syntax#8", "t": "basics.syntax", "k": "m", "q": "Hvilken af disse laver en `string`?", "a": "Python accepterer både enkelte og dobbelte anførselstegn, så længe man starter og slutter med den samme slags.", "opts": ["Både `'hej'` og `\"hej\"`", "Kun `\"hej\"`", "Kun `'hej'`", "Ingen af dem"]}, {"id": "basics.syntax#9", "t": "basics.syntax", "k": "m", "q": "Hvad adskiller argumenterne i et function call som `print(\"a\", \"b\")`?", "a": "Argumenter adskilles med komma.", "opts": ["Komma", "Semikolon", "Mellemrum", "Kolon"]}, {"id": "basics.syntax#10", "t": "basics.syntax", "k": "c", "q": "Koden skal printe `Hej Ali` og derefter `Du er 21`. Der er tre syntax errors. Ret dem.", "title": "Ret syntax errors", "hint": "Kig efter: et manglende anførselstegn, et manglende kolon og en manglende parentes.", "starter": "name = \"Ali\nage = 21\nif age >= 18\n    print(\"Hej\", name)\nprint(\"Du er\", age", "sol": "name = \"Ali\"\nage = 21\nif age >= 18:\n    print(\"Hej\", name)\nprint(\"Du er\", age)", "need": [], "forbid": [], "expect": "Hej Ali\nDu er 21"}, {"id": "basics.algo#1", "t": "basics.algo", "k": "o", "q": "Hvad er en algoritme?", "a": "En algoritme er en præcis trin for trin opskrift på, hvordan man løser et problem. Den har et input, en række veldefinerede trin og et resultat. En kageopskrift er en algoritme, og det er A* også."}, {"id": "basics.algo#2", "t": "basics.algo", "k": "o", "q": "Nævn en eller flere algoritmer, du har mødt i kurset, og hvad de bruges til.", "a": "Eksempler: `Breadth First Search`, `Dijkstra's Algorithm` og `A*` (finder vej mellem to punkter i en graf eller et grid) og `kNN` (k nearest neighbors, klassificerer et datapunkt ud fra dets nærmeste naboer)."}, {"id": "basics.algo#3", "t": "basics.algo", "k": "o", "q": "Beskriv med ord en algoritme, der finder det største tal i en list, uden at bruge `max()`.", "a": "1. Gem det første tal som \"størst indtil nu\".\n2. Gå igennem resten af tallene ét ad gangen.\n3. Hvis et tal er større end \"størst indtil nu\", så gem det i stedet.\n4. Når listen er slut, er \"størst indtil nu\" svaret.", "acode": "largest = nums[0]\nfor n in nums:\n    if n > largest:\n        largest = n"}, {"id": "basics.algo#4", "t": "basics.algo", "k": "p", "code": "a = 1\nb = 2\na = b\nb = a\nprint(a, b)", "a": "Rækkefølgen af trin betyder noget. Efter `a = b` er den gamle værdi af `a` væk, så begge ender som `2`. For at bytte skal man bruge en midlertidig variabel eller `a, b = b, a`.", "out": "2 2", "run": 1}, {"id": "basics.algo#5", "t": "basics.algo", "k": "o", "q": "Hvad er forskellen på en algoritme og et program?", "a": "En algoritme er selve idéen eller opskriften og er uafhængig af programmeringssprog. Et program er en konkret implementation af en eller flere algoritmer i et bestemt sprog, fx Python."}, {"id": "basics.algo#6", "t": "basics.algo", "k": "o", "q": "Hvorfor er rækkefølgen af linjerne i et program vigtig?", "a": "Python udfører koden oppefra og ned, én linje ad gangen. En variabel skal have en værdi, før den bruges, og en function skal være defineret, før den kaldes. Bytter man om på to linjer, kan resultatet blive et andet."}, {"id": "basics.algo#7", "t": "basics.algo", "k": "c", "q": "Skriv en function `largest(nums)`, der returnerer det største tal i listen. Du må ikke bruge `max()` eller `sort`.", "title": "Find det største tal", "hint": "Start med at antage, at det første tal er det største. Gå derefter igennem listen og opdater, hver gang du møder et større tal.", "starter": "def largest(nums):\n    # skriv din kode her\n    pass", "sol": "def largest(nums):\n    biggest = nums[0]\n    for n in nums:\n        if n > biggest:\n            biggest = n\n    return biggest", "need": [], "forbid": [["\\bmax\\s*\\(", "Du må ikke bruge max() i denne opgave."], ["\\bsort", "Du må ikke bruge sort i denne opgave."]], "tests": "assert largest([3, 9, 2]) == 9, \"largest([3, 9, 2]) skal give 9\"\nassert largest([-5, -2, -9]) == -2, \"largest([-5, -2, -9]) skal give -2 (virker den med negative tal?)\"\nassert largest([4]) == 4, \"largest([4]) skal give 4\""}, {"id": "basics.algo#8", "t": "basics.algo", "k": "c", "q": "Byt om på værdierne i `a` og `b`, så `a` ender som `\"te\"` og `b` ender som `\"kaffe\"`. Du må ikke skrive teksterne igen, du skal flytte værdierne.", "title": "Byt om på to variabler", "hint": "Brug en midlertidig variabel (`temp = a`) eller Pythons genvej `a, b = b, a`.", "starter": "a = \"kaffe\"\nb = \"te\"\n\n# byt om på a og b herunder", "sol": "a = \"kaffe\"\nb = \"te\"\n\na, b = b, a", "need": [], "forbid": [["([\"']te[\"'][\\s\\S]*){2,}", "Du må ikke skrive teksten \"te\" igen. Flyt værdierne i stedet."]], "tests": "assert a == \"te\", \"a skal være 'te'\"\nassert b == \"kaffe\", \"b skal være 'kaffe'\""}, {"id": "basics.indent#1", "t": "basics.indent", "k": "o", "q": "Hvad bruges `indentation` til i Python?", "a": "`Indentation` (indrykning) viser, hvilke linjer der hører sammen i en block. Alt, der er indented under fx en `if`, et `for` loop eller en `def`, hører til den. Når indrykningen stopper, er blokken slut. I mange andre sprog bruger man `{ }` til det samme."}, {"id": "basics.indent#2", "t": "basics.indent", "k": "m", "q": "Hvor mange spaces bruger man normalt pr. indentation level i Python?", "a": "Standarden (PEP 8) er 4 spaces. VS Code indsætter dem automatisk, når man trykker Tab.", "opts": ["4", "1", "2", "8"]}, {"id": "basics.indent#3", "t": "basics.indent", "k": "p", "code": "for i in range(3):\n    print(\"A\")\nprint(\"B\")", "a": "`print(\"A\")` er indented og hører til loopet, så den kører 3 gange. `print(\"B\")` er ikke indented og kører én gang, når loopet er færdigt.", "out": "A\nA\nA\nB", "run": 1}, {"id": "basics.indent#4", "t": "basics.indent", "k": "p", "code": "x = 5\nif x > 10:\n    print(\"stor\")\n    print(\"meget stor\")\nprint(\"færdig\")", "a": "Begge indented linjer hører til `if`, og betingelsen er `False`. Kun den sidste linje ligger uden for blokken.", "out": "færdig", "run": 1}, {"id": "basics.indent#5", "t": "basics.indent", "k": "m", "q": "Hvilken fejl får man, hvis indrykningen er forkert?", "code": "def hello():\nprint(\"hej\")", "a": "Efter `def hello():` forventer Python en indented block. Den mangler, så man får `IndentationError: expected an indented block`.", "opts": ["`IndentationError`", "`NameError`", "`ValueError`", "Ingen fejl"]}, {"id": "basics.indent#6", "t": "basics.indent", "k": "p", "code": "for i in range(2):\n    for j in range(2):\n        print(i, j)\n    print(\"--\")", "a": "`print(i, j)` ligger i det inderste loop. `print(\"--\")` ligger kun i det yderste loop, så den kører én gang for hver værdi af `i`, efter det inderste loop er færdigt.", "out": "0 0\n0 1\n--\n1 0\n1 1\n--", "run": 1}, {"id": "basics.indent#7", "t": "basics.indent", "k": "p", "code": "total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(total)", "a": "`print(total)` er indented og ligger derfor inde i loopet. Den kører efter hver addition. Flytter man den ud til venstre, printes kun `6`.", "out": "1\n3\n6", "run": 1}, {"id": "basics.indent#8", "t": "basics.indent", "k": "c", "q": "Koden skal kun printe den endelige sum (`6`) én gang, og derefter `færdig`. Ret indrykningen, uden at ændre andet.", "title": "Ret indrykningen", "hint": "Linjer, der kun skal køre én gang efter loopet, må ikke være indented under `for`.", "starter": "total = 0\nfor n in [1, 2, 3]:\n    total = total + n\n    print(total)\n    print(\"færdig\")", "sol": "total = 0\nfor n in [1, 2, 3]:\n    total = total + n\nprint(total)\nprint(\"færdig\")", "need": [], "forbid": [], "expect": "6\nfærdig"}, {"id": "vars.names#1", "t": "vars.names", "k": "m", "q": "Hvilket af disse er et gyldigt variable name?", "a": "Et navn må ikke starte med et tal, må ikke indeholde bindestreg og må ikke være et keyword som `class`.", "opts": ["`my_var2`", "`2var`", "`my-var`", "`class`"]}, {"id": "vars.names#2", "t": "vars.names", "k": "o", "q": "Hvad er reglerne for variable names i Python?", "a": "Et navn må indeholde bogstaver, tal og underscore `_`. Det må ikke starte med et tal, må ikke indeholde mellemrum eller specialtegn, og må ikke være et keyword (`if`, `for`, `class` osv.). Navne er case sensitive."}, {"id": "vars.names#3", "t": "vars.names", "k": "o", "q": "Hvad er forskellen på `camelCase` og `snake_case`, og hvad bruger man i Python?", "a": "`camelCase` skriver ord sammen med stort bogstav ved hvert nyt ord: `myPlayerScore`. `snake_case` bruger små bogstaver og underscore: `my_player_score`. I Python er konventionen (PEP 8) `snake_case` til variables og functions, `CapWords` (også kaldet PascalCase) til classes og `UPPER_CASE` til konstanter."}, {"id": "vars.names#4", "t": "vars.names", "k": "m", "q": "Hvilket navn følger Pythons konvention for en `class`?", "a": "Classes skrives med `CapWords`: stort begyndelsesbogstav i hvert ord og ingen underscore.", "opts": ["`DataPoint`", "`data_point`", "`dataPoint`", "`DATAPOINT`"]}, {"id": "vars.names#5", "t": "vars.names", "k": "o", "q": "Hvorfor er `x`, `a2` og `thing` ofte dårlige variable names? Giv et eksempel på et bedre navn.", "a": "De fortæller ikke, hvad værdien betyder, så koden bliver svær at læse, også for en selv om en måned. Brug beskrivende navne: `player_score`, `cell_size`, `is_running`. Korte navne som `i`, `x` og `y` er fine til loop counters og koordinater."}, {"id": "vars.names#6", "t": "vars.names", "k": "p", "code": "Name = \"Ali\"\nprint(name)", "a": "Variable names er case sensitive. `Name` og `name` er to forskellige navne, og `name` er aldrig blevet defineret.", "out": "", "err": "NameError", "errmsg": "NameError: name 'name' is not defined", "run": 1}, {"id": "vars.names#7", "t": "vars.names", "k": "m", "q": "Hvilket navn er skrevet i `camelCase`?", "a": "I `camelCase` starter første ord med lille bogstav, og hvert nyt ord starter med stort.", "opts": ["`playerScore`", "`player_score`", "`PLAYER_SCORE`", "`playerscore`"]}, {"id": "vars.names#8", "t": "vars.names", "k": "p", "code": "list = [1, 2, 3]\nx = list(\"abc\")", "a": "Man må gerne kalde en variabel `list`, men så overskriver man den indbyggede `list` function. Bagefter er `list` bare en liste, og den kan ikke kaldes. Undgå at bruge navne som `list`, `str`, `print`, `max` og `sum` til egne variabler.", "out": "", "err": "TypeError", "errmsg": "TypeError: 'list' object is not callable"}, {"id": "vars.types#1", "t": "vars.types", "k": "o", "q": "Nævn de fire grundlæggende datatyper i Python, og giv et eksempel på hver.", "a": "`int` (heltal): `7`\n`float` (decimaltal): `3.14`\n`str` (tekst): `\"hej\"`\n`bool` (sand eller falsk): `True` og `False`"}, {"id": "vars.types#2", "t": "vars.types", "k": "p", "code": "print(type(3))\nprint(type(3.0))\nprint(type(\"3\"))\nprint(type(True))", "a": "`type()` fortæller, hvilken datatype en værdi har. Anførselstegn gør altid værdien til en `str`, også selv om indholdet ligner et tal.", "out": "<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>", "run": 1}, {"id": "vars.types#3", "t": "vars.types", "k": "p", "code": "print(\"3\" + \"4\")", "a": "Begge værdier er strings, så `+` sætter dem sammen (concatenation) i stedet for at lægge dem sammen som tal.", "out": "34", "run": 1}, {"id": "vars.types#4", "t": "vars.types", "k": "p", "code": "print(\"3\" + 4)", "a": "Man kan ikke lægge en `str` og en `int` sammen. Lav enten begge til tal med `int(\"3\") + 4` eller begge til tekst med `\"3\" + str(4)`.", "out": "", "err": "TypeError", "errmsg": "TypeError: can only concatenate str (not \"int\") to str", "run": 1}, {"id": "vars.types#5", "t": "vars.types", "k": "p", "code": "print(int(\"3\") + 4)", "a": "`int(\"3\")` konverterer teksten til heltallet `3`. Det kaldes type conversion eller casting.", "out": "7", "run": 1}, {"id": "vars.types#6", "t": "vars.types", "k": "p", "code": "print(3 / 2)\nprint(type(4 / 2))", "a": "Division med `/` giver altid en `float`, også når resultatet går op. `4 / 2` er `2.0`.", "out": "1.5\n<class 'float'>", "run": 1}, {"id": "vars.types#7", "t": "vars.types", "k": "o", "q": "Hvad gør `int()`, `float()` og `str()`?", "a": "De konverterer en værdi til en anden type (type conversion / casting). `int(\"12\")` giver `12`, `float(\"2.5\")` giver `2.5`, og `str(12)` giver `\"12\"`. Hvis konverteringen ikke giver mening, fx `int(\"hej\")`, får man en `ValueError`."}, {"id": "vars.types#8", "t": "vars.types", "k": "p", "code": "print(int(3.9))", "a": "`int()` skærer decimalerne af. Den runder ikke. Brug `round(3.9)` hvis du vil have `4`.", "out": "3", "run": 1}, {"id": "vars.types#9", "t": "vars.types", "k": "m", "q": "Hvilken type har den værdi, som `input()` returnerer?", "a": "`input()` returnerer altid en `str`. Skal du regne med svaret, må du selv konvertere: `age = int(input(\"Alder: \"))`.", "opts": ["Altid `str`", "`int`, hvis brugeren skriver et tal", "`float`, hvis brugeren skriver et decimaltal", "Det bestemmer Python selv"]}, {"id": "vars.types#10", "t": "vars.types", "k": "p", "code": "print(\"5\" * 3)", "a": "En `str` ganget med et heltal gentager teksten. Det er ikke et regnestykke, fordi `\"5\"` er tekst.", "out": "555", "run": 1}, {"id": "vars.types#11", "t": "vars.types", "k": "o", "q": "Hvad er `None`?", "a": "`None` er Pythons værdi for \"ingenting\" eller \"ingen værdi endnu\". Det er sin egen type (`NoneType`). En function uden `return` giver `None`, og man bruger det ofte som startværdi, fx `came_from = {start: None}`."}, {"id": "vars.types#12", "t": "vars.types", "k": "p", "code": "print(str(10) + str(5))", "a": "Begge tal er lavet om til strings, så `+` sætter teksterne sammen.", "out": "105", "run": 1}, {"id": "vars.types#13", "t": "vars.types", "k": "c", "q": "`a` og `b` er strings. Print deres sum som et tal, så outputtet bliver `42`. Du må ikke ændre de to første linjer.", "title": "Fra tekst til tal", "hint": "Brug `int()` til at konvertere hver string, før du lægger dem sammen.", "starter": "a = \"12\"\nb = \"30\"\n\nprint(a + b)", "sol": "a = \"12\"\nb = \"30\"\n\nprint(int(a) + int(b))", "need": [["a = \"12\"", "Lad linjen a = \"12\" stå, som den er."], ["b = \"30\"", "Lad linjen b = \"30\" stå, som den er."]], "forbid": [], "expect": "42"}, {"id": "vars.scope#1", "t": "vars.scope", "k": "o", "q": "Hvad betyder `scope`?", "a": "`Scope` er det område af koden, hvor en variabel findes og kan bruges. En variabel, der oprettes inde i en function, har local scope og findes kun der. En variabel, der oprettes yderst i filen, har global scope."}, {"id": "vars.scope#2", "t": "vars.scope", "k": "o", "q": "Hvad er forskellen på en `local variable` og en `global variable`?", "a": "En `local variable` oprettes inde i en function og forsvinder, når funktionen er færdig. En `global variable` oprettes uden for alle functions og kan læses overalt i filen. Det er god stil at holde så meget som muligt local og sende værdier ind som arguments og ud med `return`."}, {"id": "vars.scope#3", "t": "vars.scope", "k": "p", "code": "def f():\n    y = 5\n\nf()\nprint(y)", "a": "`y` er en local variable i `f` og findes ikke uden for funktionen. Hvis værdien skal bruges udenfor, skal funktionen `return` den.", "out": "", "err": "NameError", "errmsg": "NameError: name 'y' is not defined", "run": 1}, {"id": "vars.scope#4", "t": "vars.scope", "k": "p", "code": "x = 10\n\ndef f():\n    x = 5\n    print(x)\n\nf()\nprint(x)", "a": "`x = 5` inde i funktionen opretter en ny local variable, som bare har samme navn. Den globale `x` bliver ikke ændret.", "out": "5\n10", "run": 1}, {"id": "vars.scope#5", "t": "vars.scope", "k": "p", "code": "x = 10\n\ndef f():\n    print(x)\n\nf()", "a": "En function kan godt læse en global variable. Den kan bare ikke ændre den uden videre.", "out": "10", "run": 1}, {"id": "vars.scope#6", "t": "vars.scope", "k": "o", "q": "Hvad gør keywordet `global`, og hvorfor bør man normalt undgå det?", "a": "`global x` inde i en function fortæller Python, at `x` er den globale variabel, så funktionen kan ændre den. Man undgår det, fordi det bliver svært at se, hvor en værdi ændres, og fordi functions bliver sværere at teste og genbruge. Brug parameters og `return` i stedet."}, {"id": "vars.scope#7", "t": "vars.scope", "k": "p", "code": "count = 0\n\ndef add():\n    global count\n    count += 1\n\nadd()\nadd()\nprint(count)", "a": "Med `global count` arbejder funktionen på den globale variabel, så den tæller op for hvert kald.", "out": "2", "run": 1}, {"id": "vars.scope#8", "t": "vars.scope", "k": "p", "code": "count = 0\n\ndef add():\n    count += 1\n\nadd()", "a": "`count += 1` forsøger at lave en local variable, som bygger på sin egen gamle værdi, men den har ingen værdi endnu inde i funktionen. Løsningen er at sende `count` ind som parameter og returnere den nye værdi.", "out": "", "err": "UnboundLocalError", "errmsg": "UnboundLocalError: cannot access local variable 'count' where it is not associated with a value"}, {"id": "vars.scope#9", "t": "vars.scope", "k": "p", "code": "for i in range(3):\n    pass\nprint(i)", "a": "Python har ikke block scope. En variabel, der oprettes i et loop eller en `if`, findes stadig bagefter. `i` har den sidste værdi fra loopet.", "out": "2", "run": 1}, {"id": "vars.scope#10", "t": "vars.scope", "k": "m", "q": "To forskellige functions har begge en variabel, der hedder `result`. Hvad sker der?", "a": "Local variables lever kun i deres egen function, så de påvirker ikke hinanden.", "opts": ["Det er to helt uafhængige variabler", "Den sidste overskriver den første", "Man får en `NameError`", "De deler samme værdi"]}, {"id": "vars.assign#1", "t": "vars.assign", "k": "o", "q": "Hvad er forskellen på `initialization` og `assignment`?", "a": "`Assignment` er at give en variabel en værdi med `=`. `Initialization` er den første assignment, altså der hvor variablen bliver oprettet og får sin startværdi, fx `total = 0` før et loop. I Python opretter man variablen ved at tildele den en værdi, man skal ikke angive en type."}, {"id": "vars.assign#2", "t": "vars.assign", "k": "p", "code": "x = 5\nx = x + 1\nprint(x)", "a": "Højre side regnes ud først (`5 + 1`), og resultatet gemmes derefter i `x`. `=` betyder \"sæt lig med\" og er ikke en matematisk ligning.", "out": "6", "run": 1}, {"id": "vars.assign#3", "t": "vars.assign", "k": "p", "code": "x = 5\ny = x\nx = 10\nprint(y)", "a": "`y = x` kopierer den værdi, `x` havde på det tidspunkt. Når `x` senere får en ny værdi, ændrer det ikke `y`.", "out": "5", "run": 1}, {"id": "vars.assign#4", "t": "vars.assign", "k": "o", "q": "Hvad betyder `x += 1`? Nævn et par lignende operators.", "a": "`x += 1` er en kort måde at skrive `x = x + 1` på. Tilsvarende findes `-=`, `*=`, `/=`, `//=` og `%=`."}, {"id": "vars.assign#5", "t": "vars.assign", "k": "p", "code": "a, b = 1, 2\na, b = b, a\nprint(a, b)", "a": "Python kan tildele flere variabler på én gang. Højre side regnes ud først, så `a, b = b, a` bytter om på de to værdier.", "out": "2 1", "run": 1}, {"id": "vars.assign#6", "t": "vars.assign", "k": "p", "code": "print(total)\ntotal = 0", "a": "En variabel skal have fået en værdi, før den bruges. Python læser oppefra og ned, og på linje 1 findes `total` endnu ikke.", "out": "", "err": "NameError", "errmsg": "NameError: name 'total' is not defined", "run": 1}, {"id": "vars.assign#7", "t": "vars.assign", "k": "p", "code": "x = y = 3\nx += 2\nprint(x, y)", "a": "`x = y = 3` giver begge variabler værdien `3`. Derefter ændres kun `x`.", "out": "5 3", "run": 1}, {"id": "vars.assign#8", "t": "vars.assign", "k": "p", "code": "x = 10\nx -= 3\nx *= 2\nprint(x)", "a": "Først `10 - 3 = 7`, derefter `7 * 2 = 14`.", "out": "14", "run": 1}, {"id": "vars.assign#9", "t": "vars.assign", "k": "o", "q": "Hvorfor skal `total = 0` stå før loopet og ikke inde i det?", "code": "total = 0\nfor n in [4, 5, 6]:\n    total += n\nprint(total)", "a": "Variablen skal initialiseres én gang, før vi begynder at lægge til. Står `total = 0` inde i loopet, bliver den nulstillet i hver iteration, og resultatet bliver kun det sidste tal. Fjerner man linjen helt, får man en `NameError`."}, {"id": "vars.assign#10", "t": "vars.assign", "k": "m", "q": "Hvad gør operatoren `=`?", "a": "`=` er assignment. Sammenligning hedder `==`.", "opts": ["Den giver variablen til venstre værdien fra højre side", "Den tjekker, om to værdier er ens", "Den printer værdien", "Den opretter en function"]}, {"id": "vars.expr#1", "t": "vars.expr", "k": "o", "q": "Hvad er en `expression`, og hvordan adskiller den sig fra en `statement`?", "a": "En `expression` er et stykke kode, der bliver til en værdi, fx `3 + 4`, `x * 2`, `len(names)` eller `x > 5`. En `statement` er en hel instruktion, der gør noget, fx `x = 3 + 4`, `if ...:` eller `import math`. Expressions indgår ofte i statements."}, {"id": "vars.expr#2", "t": "vars.expr", "k": "p", "code": "print(2 + 3 * 4)", "a": "Gange regnes før plus (operator precedence), ligesom i matematik.", "out": "14", "run": 1}, {"id": "vars.expr#3", "t": "vars.expr", "k": "p", "code": "print((2 + 3) * 4)", "a": "Parenteser regnes først.", "out": "20", "run": 1}, {"id": "vars.expr#4", "t": "vars.expr", "k": "p", "code": "print(2 ** 3)\nprint(2 * 3 ** 2)", "a": "`**` er potens. Potens regnes før gange, så `2 * 3 ** 2` er `2 * 9`.", "out": "8\n18", "run": 1}, {"id": "vars.expr#5", "t": "vars.expr", "k": "p", "code": "print(10 - 2 - 3)", "a": "Operators med samme precedence regnes fra venstre mod højre: `(10 - 2) - 3`.", "out": "5", "run": 1}, {"id": "vars.expr#6", "t": "vars.expr", "k": "o", "q": "I hvilken rækkefølge udregner Python en expression med flere operators?", "a": "1. Parenteser `( )`\n2. Potens `**`\n3. Gange, division, floor division og modulo `* / // %`\n4. Plus og minus `+ -`\n5. Sammenligninger `== != < > <= >=`\n6. `not`, derefter `and`, derefter `or`\nEr du i tvivl, så brug parenteser."}, {"id": "vars.expr#7", "t": "vars.expr", "k": "p", "code": "print(\"a\" + \"b\" * 2)", "a": "Gange regnes først, også for strings: `\"b\" * 2` er `\"bb\"`, og derefter sættes `\"a\"` foran.", "out": "abb", "run": 1}, {"id": "vars.expr#8", "t": "vars.expr", "k": "p", "code": "x = 4\nprint(x * 2 > 5)", "a": "Regnestykket udføres før sammenligningen: `8 > 5` er `True`.", "out": "True", "run": 1}, {"id": "vars.expr#9", "t": "vars.expr", "k": "m", "q": "Hvilken af disse er en `expression` (noget, der har en værdi)?", "a": "`3 + 4` bliver til værdien `7`. De andre er statements, som gør noget, men ikke selv er en værdi.", "opts": ["`3 + 4`", "`import math`", "`x = 3`", "`def f():`"]}, {"id": "vars.expr#10", "t": "vars.expr", "k": "p", "code": "print(len(\"hej\") + 1)", "a": "Et function call er også en expression. `len(\"hej\")` bliver til `3`.", "out": "4", "run": 1}, {"id": "vars.bool#1", "t": "vars.bool", "k": "o", "q": "Hvad er en `boolean`?", "a": "En `boolean` (`bool`) er en datatype med kun to mulige værdier: `True` og `False` (med stort begyndelsesbogstav). Sammenligninger som `x > 5` giver en boolean, og det er booleans, der styrer `if` statements og `while` loops."}, {"id": "vars.bool#2", "t": "vars.bool", "k": "p", "code": "print(5 > 3)\nprint(5 == 3)\nprint(type(5 > 3))", "a": "En sammenligning er en expression, der giver en `bool`.", "out": "True\nFalse\n<class 'bool'>", "run": 1}, {"id": "vars.bool#3", "t": "vars.bool", "k": "o", "q": "Hvad betyder det, at en værdi er `truthy` eller `falsy`? Hvilke værdier er falsy?", "a": "Alle værdier kan bruges som betingelse i en `if`. De fleste tæller som `True` (truthy). Følgende tæller som `False` (falsy): `False`, `None`, `0`, `0.0`, den tomme string `\"\"` og tomme samlinger som `[]`, `{}` og `()`."}, {"id": "vars.bool#4", "t": "vars.bool", "k": "p", "code": "print(bool(0), bool(7), bool(\"\"), bool(\"hej\"))", "a": "`0` og den tomme string er falsy. Alle andre tal og alle ikke tomme strings er truthy.", "out": "False True False True", "run": 1}, {"id": "vars.bool#5", "t": "vars.bool", "k": "p", "code": "items = []\nif items:\n    print(\"ikke tom\")\nelse:\n    print(\"tom\")", "a": "En tom list er falsy, så `if items:` er en kort måde at spørge \"er der noget i listen?\".", "out": "tom", "run": 1}, {"id": "vars.bool#6", "t": "vars.bool", "k": "m", "q": "Hvilken af disse værdier er `falsy`?", "a": "En tom list er falsy. `\"False\"` er en ikke tom string, `[0]` er en list med ét element, og `-1` er et tal forskelligt fra 0, så de er alle truthy.", "opts": ["`[]`", "`\"False\"`", "`[0]`", "`-1`"]}, {"id": "vars.bool#7", "t": "vars.bool", "k": "p", "code": "age = 20\nis_adult = age >= 18\nprint(is_adult)", "a": "Resultatet af en sammenligning kan gemmes i en variabel ligesom alle andre værdier.", "out": "True", "run": 1}, {"id": "vars.bool#8", "t": "vars.bool", "k": "o", "q": "Hvorfor skriver man `if running:` i stedet for `if running == True:`?", "a": "`running` er allerede en boolean, så sammenligningen med `True` er overflødig. `if running:` er kortere og nemmere at læse. Det modsatte skrives `if not running:`."}, {"id": "vars.fstr#1", "t": "vars.fstr", "k": "o", "q": "Hvad er en `f-string`?", "a": "En `f-string` er en string med et `f` foran anførselstegnet. Inde i den kan man skrive variabler og expressions i `{ }`, og Python sætter deres værdier ind i teksten: `f\"Hej {name}\"`."}, {"id": "vars.fstr#2", "t": "vars.fstr", "k": "p", "code": "name = \"Ali\"\nage = 21\nprint(f\"{name} er {age} år\")", "a": "Værdierne af `name` og `age` sættes ind, hvor der står `{ }`. Man behøver ikke konvertere `age` med `str()`.", "out": "Ali er 21 år", "run": 1}, {"id": "vars.fstr#3", "t": "vars.fstr", "k": "p", "code": "x = 3\nprint(f\"{x} * 2 = {x * 2}\")", "a": "Man kan skrive en hel expression i `{ }`. Tekst uden for `{ }` printes præcis, som den står.", "out": "3 * 2 = 6", "run": 1}, {"id": "vars.fstr#4", "t": "vars.fstr", "k": "p", "code": "pi = 3.14159\nprint(f\"{pi:.2f}\")", "a": "`:.2f` efter variablen betyder \"vis som float med 2 decimaler\".", "out": "3.14", "run": 1}, {"id": "vars.fstr#5", "t": "vars.fstr", "k": "p", "code": "name = \"Ali\"\nprint(\"Hej {name}\")", "a": "Der mangler et `f` foran strengen, så det er en helt almindelig string, og `{name}` printes som tekst.", "out": "Hej {name}", "run": 1}, {"id": "vars.fstr#6", "t": "vars.fstr", "k": "m", "q": "`age = 20`. Hvilken linje printer `Jeg er 20 år`?", "a": "Der skal både være `f` foran og `{ }` omkring variablen. Den sidste mulighed giver en `TypeError`, fordi man ikke kan lægge `str` og `int` sammen.", "opts": ["`print(f\"Jeg er {age} år\")`", "`print(\"Jeg er {age} år\")`", "`print(f\"Jeg er age år\")`", "`print(\"Jeg er \" + age + \" år\")`"]}, {"id": "vars.fstr#7", "t": "vars.fstr", "k": "o", "q": "Hvordan kan man sætte en variabel ind i en tekst uden at bruge en f-string?", "a": "Med concatenation og `str()`: `\"Jeg er \" + str(age) + \" år\"`.\nMed komma i `print`: `print(\"Jeg er\", age, \"år\")` (indsætter selv mellemrum).\nMed `.format()`: `\"Jeg er {} år\".format(age)`.\nF-strings er normalt nemmest at læse."}, {"id": "vars.fstr#8", "t": "vars.fstr", "k": "p", "code": "age = 20\nprint(\"Jeg er \" + age + \" år\")", "a": "`+` kan ikke sætte en `str` og en `int` sammen. Brug `str(age)` eller en f-string.", "out": "", "err": "TypeError", "errmsg": "TypeError: can only concatenate str (not \"int\") to str", "run": 1}, {"id": "vars.fstr#9", "t": "vars.fstr", "k": "p", "code": "a = 2\nb = 3\nprint(f\"{a}+{b}={a + b}\")", "a": "Hver `{ }` udregnes for sig og sættes ind i teksten.", "out": "2+3=5", "run": 1}, {"id": "vars.fstr#10", "t": "vars.fstr", "k": "c", "q": "Brug en f-string til at printe `Ali fik 42 point`. Du skal bruge variablerne `name` og `score`.", "title": "Byg en sætning med f-string", "starter": "name = \"Ali\"\nscore = 42\n\n# print sætningen herunder", "sol": "name = \"Ali\"\nscore = 42\n\nprint(f\"{name} fik {score} point\")", "need": [["f[\"']", "Brug en f-string, altså et f foran anførselstegnet."], ["\\{\\s*name\\s*\\}", "Sæt variablen name ind med {name}."], ["\\{\\s*score\\s*\\}", "Sæt variablen score ind med {score}."]], "forbid": [], "expect": "Ali fik 42 point"}, {"id": "vars.under#1", "t": "vars.under", "k": "o", "q": "Hvad bruger man en enkelt underscore `_` til som variable name?", "a": "`_` er et gyldigt navn, og efter konvention bruger man det til en værdi, man ikke har tænkt sig at bruge. Det viser læseren, at værdien er ligegyldig, fx `for _ in range(3):` eller `x, _ = position`."}, {"id": "vars.under#2", "t": "vars.under", "k": "p", "code": "for _ in range(3):\n    print(\"hej\")", "a": "Loopet kører 3 gange. Loop variablen bruges ikke til noget, så den hedder `_`.", "out": "hej\nhej\nhej", "run": 1}, {"id": "vars.under#3", "t": "vars.under", "k": "p", "code": "x, _ = (3, 4)\nprint(x)", "a": "En tuple pakkes ud i to variabler. Vi skal kun bruge den første, så den anden får navnet `_`.", "out": "3", "run": 1}, {"id": "vars.under#4", "t": "vars.under", "k": "o", "q": "Hvad signalerer et navn, der starter med underscore, fx `_helper` eller `self._speed`?", "a": "Det er en konvention for \"privat\": navnet er tænkt til internt brug i modulet eller klassen, og andre bør ikke bruge det direkte. Python forhindrer det ikke, det er kun et signal til dem, der læser koden."}, {"id": "vars.under#5", "t": "vars.under", "k": "o", "q": "Hvad er \"dunder\" navne som `__init__` og `__name__`?", "a": "\"Dunder\" betyder double underscore. Det er navne med to underscores på hver side, som Python selv bruger til særlige formål. `__init__` er constructor i en class, og `__name__` er en variabel, der fortæller, om filen køres direkte eller bliver importeret."}, {"id": "vars.under#6", "t": "vars.under", "k": "o", "q": "Hvad gør denne linje, og hvorfor bruger man den?", "code": "if __name__ == \"__main__\":\n    main()", "a": "`__name__` er lig `\"__main__\"`, når filen køres direkte. Hvis filen i stedet importeres som et module fra en anden fil, er betingelsen `False`, og `main()` køres ikke. Dermed kan man importere filens functions og classes, uden at hele programmet starter."}, {"id": "vars.under#7", "t": "vars.under", "k": "m", "q": "Hvornår giver det mening at skrive `for _ in range(5):`?", "a": "`_` viser, at tælleren ikke bruges inde i loopet.", "opts": ["Når man vil gentage noget 5 gange og ikke skal bruge loop variablen", "Når man vil tælle baglæns", "Når loopet skal køre uendeligt", "Når man vil springe en iteration over"]}, {"id": "vars.under#8", "t": "vars.under", "k": "c", "q": "Print ordet `Python` tre gange (én gang pr. linje) med et `for` loop. Du skal ikke bruge loop variablen, så kald den `_`.", "title": "Gentag uden tæller", "starter": "# skriv dit loop herunder", "sol": "for _ in range(3):\n    print(\"Python\")", "need": [["for\\s+_\\s+in\\s+range", "Brug et loop af formen: for _ in range(...)"]], "forbid": [], "expect": "Python\nPython\nPython"}, {"id": "vars.math#1", "t": "vars.math", "k": "p", "code": "print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)", "a": "`/` er almindelig division og giver en float. `//` er floor division (heltalsdivision) og smider resten væk. `%` er modulo og giver resten: 7 divideret med 2 er 3 med 1 til rest.", "out": "3.5\n3\n1", "run": 1}, {"id": "vars.math#2", "t": "vars.math", "k": "p", "code": "print(10 % 5, 11 % 5)", "a": "`10 % 5` er `0`, fordi 5 går op i 10. `11 % 5` giver resten 1.", "out": "0 1", "run": 1}, {"id": "vars.math#3", "t": "vars.math", "k": "o", "q": "Hvad gør `//` og `%`, og hvad kan man bruge dem til?", "a": "`//` (floor division) dividerer og runder ned til et heltal. `%` (modulo) giver resten ved divisionen.\nTypiske anvendelser: tjekke om et tal er lige (`n % 2 == 0`), gøre noget hver tiende gang (`i % 10 == 0`), omregne pixel til grid cell (`x // cell_size`) og omregne sekunder til minutter og sekunder (`s // 60` og `s % 60`)."}, {"id": "vars.math#4", "t": "vars.math", "k": "p", "code": "print(17 // 5, 17 % 5)", "a": "5 går 3 hele gange op i 17 (det giver 15), og der er 2 til rest.", "out": "3 2", "run": 1}, {"id": "vars.math#5", "t": "vars.math", "k": "m", "q": "Hvordan tjekker man, om `n` er et lige tal?", "a": "Et lige tal har resten 0, når det divideres med 2.", "opts": ["`n % 2 == 0`", "`n // 2 == 0`", "`n / 2 == 0`", "`n % 2 == 1`"]}, {"id": "vars.math#6", "t": "vars.math", "k": "o", "q": "Musen er på pixel `x = 250`, og hver grid cell er `12` pixels bred. Hvilken kolonne er musen i, og hvilken operator bruger man?", "a": "`250 // 12` giver `20`, så musen er i kolonne 20 (talt fra 0). Man bruger `//`, fordi en kolonne skal være et heltal. Almindelig division ville give `20.83`, som ikke kan bruges som index."}, {"id": "vars.math#7", "t": "vars.math", "k": "p", "code": "print(6 / 2)\nprint(6 // 2)", "a": "`/` giver altid en `float`, også når det går op. `//` mellem to heltal giver en `int`.", "out": "3.0\n3", "run": 1}, {"id": "vars.math#8", "t": "vars.math", "k": "p", "code": "import math\nprint(math.sqrt(16))\nprint(2 ** 10)", "a": "`math.sqrt()` giver kvadratroden som float. `**` er potens.", "out": "4.0\n1024", "run": 1}, {"id": "vars.math#9", "t": "vars.math", "k": "p", "code": "print(abs(-5), round(3.7), max(2, 9), min(2, 9))", "a": "`abs()` giver den numeriske værdi, `round()` runder af, og `max()` og `min()` giver den største og mindste værdi.", "out": "5 4 9 2", "run": 1}, {"id": "vars.math#10", "t": "vars.math", "k": "p", "code": "print(round(2.567, 1))", "a": "Det andet argument til `round()` er antallet af decimaler.", "out": "2.6", "run": 1}, {"id": "vars.math#11", "t": "vars.math", "k": "c", "q": "Skriv en function `is_even(n)`, der returnerer `True`, hvis `n` er et lige tal, og ellers `False`.", "title": "Lige eller ulige", "hint": "Brug modulo: et lige tal har resten 0, når det divideres med 2.", "starter": "def is_even(n):\n    # skriv din kode her\n    pass", "sol": "def is_even(n):\n    return n % 2 == 0", "need": [], "forbid": [], "tests": "assert is_even(4) == True, \"is_even(4) skal give True\"\nassert is_even(7) == False, \"is_even(7) skal give False\"\nassert is_even(0) == True, \"is_even(0) skal give True\""}, {"id": "vars.math#12", "t": "vars.math", "k": "c", "q": "Brug `//` og `%` til at omregne `total` minutter, så programmet printer `2 timer og 15 minutter`. Koden skal også virke, hvis man ændrer `total`.", "title": "Minutter til timer og minutter", "hint": "Hele timer: `total // 60`. Minutter til overs: `total % 60`.", "starter": "total = 135\n\nhours = 0\nminutes = 0\nprint(f\"{hours} timer og {minutes} minutter\")", "sol": "total = 135\n\nhours = total // 60\nminutes = total % 60\nprint(f\"{hours} timer og {minutes} minutter\")", "need": [["//", "Brug floor division (//) til at finde antal hele timer."], ["%", "Brug modulo (%) til at finde de resterende minutter."]], "forbid": [], "expect": "2 timer og 15 minutter"}, {"id": "pg.coords#1", "t": "pg.coords", "k": "o", "q": "Hvor ligger punktet `(0, 0)` i et pygame vindue, og hvilken vej går akserne?", "a": "`(0, 0)` er øverste venstre hjørne. `x` vokser mod højre, og `y` vokser nedad. Det er omvendt af matematikkens koordinatsystem, hvor `y` vokser opad."}, {"id": "pg.coords#2", "t": "pg.coords", "k": "m", "q": "Vinduet er `640 x 480`. Hvor ligger punktet `(0, 480)`?", "a": "`x = 0` er helt til venstre, og `y = 480` er helt i bunden, fordi `y` vokser nedad.", "opts": ["Nederste venstre hjørne", "Øverste højre hjørne", "Øverste venstre hjørne", "Nederste højre hjørne"]}, {"id": "pg.coords#3", "t": "pg.coords", "k": "m", "q": "Hvad sker der med en figur på skærmen, når dens `y` værdi bliver større?", "a": "I pygame vokser `y` nedad.", "opts": ["Den flytter sig nedad", "Den flytter sig opad", "Den flytter sig mod højre", "Den bliver større"]}, {"id": "pg.coords#4", "t": "pg.coords", "k": "o", "q": "Hvordan finder man centrum af et vindue på `800 x 600`?", "a": "Centrum er `(width // 2, height // 2)`, altså `(400, 300)`. Man bruger `//`, så koordinaterne bliver heltal."}, {"id": "pg.coords#5", "t": "pg.coords", "k": "m", "q": "`screen = pygame.display.set_mode((800, 600))`. Hvad er `800`?", "a": "Størrelsen angives som en tuple `(width, height)`.", "opts": ["Vinduets bredde i pixels", "Vinduets højde i pixels", "Antal frames pr. sekund", "Antal farver"]}, {"id": "pg.coords#6", "t": "pg.coords", "k": "o", "q": "I `pygame.draw.rect(screen, color, (x, y, w, h))`: hvilket punkt på rektanglet er `(x, y)`?", "a": "`(x, y)` er rektanglets øverste venstre hjørne. `w` er bredden mod højre, og `h` er højden nedad."}, {"id": "pg.coords#7", "t": "pg.coords", "k": "m", "q": "Et rektangel tegnes med `(100, 50, 30, 20)`. Hvor er dets nederste højre hjørne?", "a": "Start i `(100, 50)`, læg bredden 30 til `x` og højden 20 til `y`.", "opts": ["`(130, 70)`", "`(30, 20)`", "`(70, 30)`", "`(100, 50)`"]}, {"id": "pg.coords#8", "t": "pg.coords", "k": "o", "q": "Et grid har celler på `20 x 20` pixels. Hvor på skærmen skal cellen i kolonne 3, række 2 tegnes, og hvorfor?", "a": "I pixel `(60, 40)`. Man ganger grid koordinaten med cellestørrelsen: `x = col * cell_size` og `y = row * cell_size`. Det giver cellens øverste venstre hjørne."}, {"id": "pg.coords#9", "t": "pg.coords", "k": "o", "q": "Brugeren klikker på pixel `(250, 130)`, og hver celle er `10 x 10` pixels. Hvilken celle blev der klikket på?", "a": "Kolonne `250 // 10 = 25` og række `130 // 10 = 13`. Floor division omregner fra pixel til grid koordinat."}, {"id": "pg.coords#10", "t": "pg.coords", "k": "c", "q": "Skriv to functions. `grid_to_pixel(col, row, cell_size)` returnerer en tuple med pixel positionen for cellens øverste venstre hjørne. `pixel_to_grid(x, y, cell_size)` returnerer en tuple `(col, row)` for den celle, som pixlen ligger i.", "title": "Fra grid til pixel og tilbage", "hint": "Gang med `cell_size` den ene vej, og brug `//` den anden vej.", "starter": "def grid_to_pixel(col, row, cell_size):\n    pass\n\ndef pixel_to_grid(x, y, cell_size):\n    pass", "sol": "def grid_to_pixel(col, row, cell_size):\n    return (col * cell_size, row * cell_size)\n\ndef pixel_to_grid(x, y, cell_size):\n    return (x // cell_size, y // cell_size)", "need": [], "forbid": [], "tests": "assert grid_to_pixel(3, 2, 20) == (60, 40), \"grid_to_pixel(3, 2, 20) skal give (60, 40)\"\nassert grid_to_pixel(0, 0, 12) == (0, 0), \"grid_to_pixel(0, 0, 12) skal give (0, 0)\"\nassert pixel_to_grid(250, 130, 10) == (25, 13), \"pixel_to_grid(250, 130, 10) skal give (25, 13)\"\nassert pixel_to_grid(59, 41, 20) == (2, 2), \"pixel_to_grid(59, 41, 20) skal give (2, 2). Husk at resultatet skal være heltal.\""}, {"id": "pg.draw#1", "t": "pg.draw", "k": "o", "q": "Hvad gør `pygame.display.flip()`?", "a": "Alt, hvad man tegner, bliver først tegnet på en usynlig flade i hukommelsen. `pygame.display.flip()` viser den færdige frame på skærmen. Glemmer man den, ser man ingenting eller kun det gamle billede."}, {"id": "pg.draw#2", "t": "pg.draw", "k": "o", "q": "Hvordan angiver man en farve i pygame?", "a": "Som en tuple med tre tal mellem 0 og 255: `(red, green, blue)`. `(255, 0, 0)` er rød, `(0, 255, 0)` er grøn, `(0, 0, 255)` er blå, `(0, 0, 0)` er sort og `(255, 255, 255)` er hvid."}, {"id": "pg.draw#3", "t": "pg.draw", "k": "m", "q": "Hvilken farve er `(255, 255, 0)`?", "a": "Rød og grøn på fuld styrke uden blå giver gul.", "opts": ["Gul", "Lilla", "Cyan", "Hvid"]}, {"id": "pg.draw#4", "t": "pg.draw", "k": "m", "q": "Hvilken farve er `(0, 0, 0)`?", "a": "Ingen rød, grøn eller blå giver sort.", "opts": ["Sort", "Hvid", "Grå", "Gennemsigtig"]}, {"id": "pg.draw#5", "t": "pg.draw", "k": "o", "q": "Hvilke argumenter skal `pygame.draw.line()` have?", "a": "`pygame.draw.line(screen, color, start_pos, end_pos, width)`.\n`screen` er den flade, der tegnes på, `color` er en RGB tuple, `start_pos` og `end_pos` er tuples med `(x, y)`, og `width` er linjens tykkelse (kan udelades)."}, {"id": "pg.draw#6", "t": "pg.draw", "k": "o", "q": "Hvordan tegner man en cirkel og et rektangel i pygame?", "a": "Cirkel: `pygame.draw.circle(screen, color, center, radius)`, hvor `center` er en tuple `(x, y)`.\nRektangel: `pygame.draw.rect(screen, color, (x, y, width, height))`, hvor `(x, y)` er øverste venstre hjørne."}, {"id": "pg.draw#7", "t": "pg.draw", "k": "o", "q": "Hvad gør `screen.fill((255, 255, 255))`, og hvorfor kalder man den ofte i starten af hver frame?", "a": "Den fylder hele vinduet med én farve (her hvid). Hvis man ikke rydder skærmen hver frame, bliver det gamle billede stående, og en figur, der bevæger sig, efterlader et spor."}, {"id": "pg.draw#8", "t": "pg.draw", "k": "o", "q": "Beskriv strukturen i et typisk pygame program (game loop).", "a": "1. `pygame.init()` og opret vinduet med `pygame.display.set_mode()`.\n2. Et `while` loop, der kører, så længe programmet er i gang.\n3. I hver iteration: håndter events, opdater tilstanden (positioner osv.), tegn alt, og kald `pygame.display.flip()`.\n4. `clock.tick(60)` begrænser hastigheden.\n5. `pygame.quit()` når loopet slutter."}, {"id": "pg.draw#9", "t": "pg.draw", "k": "o", "q": "Hvad gør `clock.tick(60)`?", "a": "Den venter lige præcis så længe, at loopet højst kører 60 gange i sekundet (60 FPS). Uden den kører programmet så hurtigt, computeren kan, og hastigheden bliver forskellig fra maskine til maskine."}, {"id": "pg.draw#10", "t": "pg.draw", "k": "m", "q": "Man tegner først en rød cirkel og derefter et blåt rektangel samme sted. Hvad ser man?", "a": "Det, der tegnes sidst, ligger øverst. Derfor tegner man baggrunden først.", "opts": ["Rektanglet ligger oven på cirklen", "Cirklen ligger oven på rektanglet", "Farverne blandes til lilla", "Kun det første, der blev tegnet"]}, {"id": "pg.draw#11", "t": "pg.draw", "k": "o", "q": "Vinduet forbliver sort, selv om cirklen bliver tegnet. Hvad mangler der?", "code": "screen = pygame.display.set_mode((400, 300))\npygame.draw.circle(screen, (255, 0, 0), (100, 100), 20)\n\nwhile True:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            pygame.quit()\n            exit()", "a": "Der mangler `pygame.display.flip()` (eller `pygame.display.update()`). Cirklen er tegnet i hukommelsen, men bliver aldrig vist på skærmen."}, {"id": "pg.draw#12", "t": "pg.draw", "k": "o", "q": "Hvad er en `widget` i PyQt? Nævn et par eksempler.", "a": "En `widget` er et element i brugerfladen. Eksempler: `QLabel` (tekst), `QPushButton` (knap), `QLineEdit` (tekstfelt på én linje), `QTextEdit` (større tekstfelt) og `QMainWindow` (selve vinduet)."}, {"id": "pg.draw#13", "t": "pg.draw", "k": "o", "q": "Hvad er `signals` og `slots` i PyQt?", "a": "Et `signal` sendes, når der sker noget, fx at en knap bliver trykket. En `slot` er den function eller method, der skal køre som reaktion. Man forbinder dem med `connect`: `button.clicked.connect(self.on_click)`. Bemærk at der ikke er parenteser efter `on_click`, fordi vi giver funktionen videre og ikke kalder den."}, {"id": "pg.draw#14", "t": "pg.draw", "k": "o", "q": "Hvad bruger man `layouts` til i PyQt?", "a": "Et layout placerer widgets automatisk i vinduet, så man ikke selv skal regne pixel positioner ud. `QVBoxLayout` stiller dem under hinanden, `QHBoxLayout` stiller dem ved siden af hinanden, og `QGridLayout` lægger dem i et gitter."}, {"id": "pg.draw#15", "t": "pg.draw", "k": "o", "q": "Hvornår ville du vælge pygame, og hvornår PyQt?", "a": "`pygame` er godt, når man selv vil tegne alt på en flade: spil, simulationer og visualisering af fx et grid og en sti. `PyQt` er godt til klassiske programmer med knapper, menuer, tekstfelter og dialoger."}, {"id": "input.event#1", "t": "input.event", "k": "o", "q": "Hvad returnerer `pygame.event.get()`?", "a": "En list med alle de events, der er sket, siden man sidst spurgte: tastetryk, museklik, musebevægelser, lukning af vinduet osv. Man går typisk igennem listen med et `for` loop."}, {"id": "input.event#2", "t": "input.event", "k": "o", "q": "Hvorfor skal man hente events i hver iteration af game loopet?", "a": "Fordi programmet ellers ikke reagerer på brugeren. Hvis man aldrig kalder `pygame.event.get()`, hober events sig op, vinduet kan ikke lukkes, og styresystemet melder, at programmet ikke svarer."}, {"id": "input.event#3", "t": "input.event", "k": "o", "q": "Hvad er `pygame.QUIT`, og hvordan håndterer man det?", "a": "`pygame.QUIT` er den event type, der kommer, når brugeren trykker på vinduets luk knap. Man tjekker `if event.type == pygame.QUIT:` og stopper så loopet eller kalder `pygame.quit()`."}, {"id": "input.event#4", "t": "input.event", "k": "o", "q": "Hvordan tjekker man, om brugeren har trykket på mellemrumstasten?", "a": "Tjek først event typen og derefter hvilken tast:", "acode": "for event in pygame.event.get():\n    if event.type == pygame.KEYDOWN:\n        if event.key == pygame.K_SPACE:\n            print(\"mellemrum\")"}, {"id": "input.event#5", "t": "input.event", "k": "o", "q": "Hvad er forskellen på `KEYDOWN`, `KEYUP` og `pygame.key.get_pressed()`?", "a": "`KEYDOWN` er et event, der sendes én gang i det øjeblik, en tast trykkes ned. `KEYUP` sendes én gang, når den slippes. `pygame.key.get_pressed()` er ikke et event, men giver tilstanden lige nu for alle taster, så man kan spørge \"holdes tasten nede i denne frame?\"."}, {"id": "input.event#6", "t": "input.event", "k": "o", "q": "Hvordan opdager man et museklik, og hvordan finder man ud af, hvor der blev klikket?", "a": "Museklik giver et event af typen `pygame.MOUSEBUTTONDOWN`. Positionen står i `event.pos` som en tuple `(x, y)`, eller man kan kalde `pygame.mouse.get_pos()`. `event.button` fortæller, hvilken knap det var (1 er venstre)."}, {"id": "input.event#7", "t": "input.event", "k": "m", "q": "Hvilket event kommer, når brugeren klikker på krydset i vinduets hjørne?", "a": "Luk knappen sender et `pygame.QUIT` event.", "opts": ["`pygame.QUIT`", "`pygame.KEYDOWN`", "`pygame.MOUSEBUTTONDOWN`", "`pygame.K_ESCAPE`"]}, {"id": "input.event#8", "t": "input.event", "k": "m", "q": "Hvad er `pygame.K_a`?", "a": "`K_a`, `K_SPACE`, `K_LEFT` osv. er konstanter, man sammenligner `event.key` med.", "opts": ["En konstant, der står for tasten A", "En function, der venter på tasten A", "En variabel, der er `True`, når A holdes nede", "En event type"]}, {"id": "input.event#9", "t": "input.event", "k": "o", "q": "Forklar linje for linje, hvad denne kode gør.", "code": "for event in pygame.event.get():\n    if event.type == pygame.QUIT:\n        running = False\n    elif event.type == pygame.KEYDOWN:\n        if event.key == pygame.K_LEFT:\n            x -= 10", "a": "Linje 1: gå igennem alle nye events.\nLinje 2 og 3: hvis vinduet bliver lukket, sættes `running` til `False`, så game loopet stopper.\nLinje 4: ellers, hvis en tast blev trykket ned,\nlinje 5 og 6: og tasten var venstre piletast, så flyttes `x` 10 pixels mod venstre."}, {"id": "input.event#10", "t": "input.event", "k": "o", "q": "Med `KEYDOWN` flytter figuren sig kun ét skridt pr. tastetryk. Hvordan får man den til at bevæge sig, så længe tasten holdes nede?", "a": "Enten med `keys = pygame.key.get_pressed()` og `if keys[pygame.K_LEFT]:` i hver frame, eller ved at gemme en retning eller hastighed ved `KEYDOWN` og nulstille den ved `KEYUP`, og så flytte figuren i hver frame ud fra den."}, {"id": "input.event#11", "t": "input.event", "k": "m", "q": "Hvad returnerer `pygame.mouse.get_pos()`?", "a": "Positionen er i pixels, målt fra vinduets øverste venstre hjørne.", "opts": ["En tuple `(x, y)` med musens position i vinduet", "`True`, hvis der er klikket", "En list med alle museklik", "Navnet på den knap, der er trykket"]}, {"id": "input.event#12", "t": "input.event", "k": "o", "q": "Hvad er et `event` helt generelt?", "a": "Et `event` er en besked om, at der er sket noget, som programmet kan reagere på: et tastetryk, et museklik, at vinduet lukkes osv. Hvert event har en `type` og nogle ekstra oplysninger, fx `event.key` eller `event.pos`."}, {"id": "branch.ifelse#1", "t": "branch.ifelse", "k": "p", "code": "x = 7\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelse:\n    print(\"C\")", "a": "Første betingelse er `False`. `elif` betingelsen er `True`, så `B` printes, og resten af kæden springes over.", "out": "B", "run": 1}, {"id": "branch.ifelse#2", "t": "branch.ifelse", "k": "p", "code": "x = 15\nif x > 5:\n    print(\"A\")\nif x > 10:\n    print(\"B\")", "a": "To separate `if` statements tjekkes uafhængigt af hinanden, og begge betingelser er `True`.", "out": "A\nB", "run": 1}, {"id": "branch.ifelse#3", "t": "branch.ifelse", "k": "p", "code": "x = 15\nif x > 5:\n    print(\"A\")\nelif x > 10:\n    print(\"B\")", "a": "I en `if`/`elif` kæde køres kun den første gren, hvis betingelse er `True`. `elif` bliver slet ikke tjekket.", "out": "A", "run": 1}, {"id": "branch.ifelse#4", "t": "branch.ifelse", "k": "o", "q": "Hvad er forskellen på at skrive to `if` efter hinanden og at skrive `if` efterfulgt af `elif`?", "a": "To `if` er uafhængige: begge betingelser tjekkes, og begge blokke kan køre. `if`/`elif` er én kæde: Python stopper ved den første betingelse, der er `True`, så højst én blok kører."}, {"id": "branch.ifelse#5", "t": "branch.ifelse", "k": "o", "q": "Hvad hedder \"else if\" i Python, og skal en `if` altid have en `else`?", "a": "Det hedder `elif`. En `if` behøver hverken `elif` eller `else`. `else` har ingen betingelse og kører kun, hvis ingen af betingelserne over den var `True`."}, {"id": "branch.ifelse#6", "t": "branch.ifelse", "k": "m", "q": "Hvor mange `elif` må der være i én `if` kæde?", "a": "Man kan have vilkårligt mange `elif`, men højst én `else`, og den skal stå sidst.", "opts": ["Så mange man vil", "Højst én", "Højst to", "Ingen, hvis der er en `else`"]}, {"id": "branch.ifelse#7", "t": "branch.ifelse", "k": "p", "code": "age = 20\nhas_ticket = False\nif age >= 18:\n    if has_ticket:\n        print(\"Velkommen\")\n    else:\n        print(\"Køb billet\")\nelse:\n    print(\"For ung\")", "a": "Den ydre betingelse er `True`, så vi går ind i den indre `if` (nested if). `has_ticket` er `False`, så den indre `else` kører.", "out": "Køb billet", "run": 1}, {"id": "branch.ifelse#8", "t": "branch.ifelse", "k": "p", "code": "temp = 0\nif temp > 0:\n    print(\"plus\")\nelif temp < 0:\n    print(\"minus\")\nelse:\n    print(\"nul\")", "a": "Ingen af de to betingelser er `True`, når `temp` er præcis 0, så `else` kører.", "out": "nul", "run": 1}, {"id": "branch.ifelse#9", "t": "branch.ifelse", "k": "p", "code": "x = 95\nif x > 50:\n    print(\"ok\")\nelif x > 90:\n    print(\"top\")", "a": "Rækkefølgen af betingelserne betyder noget. `x > 50` er `True` først, så `elif` nås aldrig. Den mest specifikke betingelse (`x > 90`) skal stå øverst.", "out": "ok", "run": 1}, {"id": "branch.ifelse#10", "t": "branch.ifelse", "k": "c", "q": "Skriv en function `result(points)`, der returnerer teksten `\"bestået\"`, hvis `points` er 50 eller derover, og ellers `\"ikke bestået\"`.", "title": "Bestået eller ikke bestået", "hint": "Brug `>=` så 50 tæller med.", "starter": "def result(points):\n    # skriv din kode her\n    pass", "sol": "def result(points):\n    if points >= 50:\n        return \"bestået\"\n    else:\n        return \"ikke bestået\"", "need": [], "forbid": [], "tests": "assert result(80) == \"bestået\", \"result(80) skal give 'bestået'\"\nassert result(50) == \"bestået\", \"result(50) skal give 'bestået' (50 er nok)\"\nassert result(49) == \"ikke bestået\", \"result(49) skal give 'ikke bestået'\""}, {"id": "branch.ifelse#11", "t": "branch.ifelse", "k": "c", "q": "Skriv en function `sign(n)`, der returnerer `\"positiv\"`, `\"negativ\"` eller `\"nul\"` afhængigt af tallet.", "title": "Positiv, negativ eller nul", "hint": "Du skal bruge `if`, `elif` og `else`.", "starter": "def sign(n):\n    # skriv din kode her\n    pass", "sol": "def sign(n):\n    if n > 0:\n        return \"positiv\"\n    elif n < 0:\n        return \"negativ\"\n    else:\n        return \"nul\"", "need": [], "forbid": [], "tests": "assert sign(5) == \"positiv\", \"sign(5) skal give 'positiv'\"\nassert sign(-3) == \"negativ\", \"sign(-3) skal give 'negativ'\"\nassert sign(0) == \"nul\", \"sign(0) skal give 'nul'\""}, {"id": "branch.boolexp#1", "t": "branch.boolexp", "k": "p", "code": "print(True and False)\nprint(True or False)\nprint(not True)", "a": "`and` kræver, at begge sider er `True`. `or` kræver kun én. `not` vender værdien om.", "out": "False\nTrue\nFalse", "run": 1}, {"id": "branch.boolexp#2", "t": "branch.boolexp", "k": "o", "q": "Forklar de tre logiske operators `and`, `or` og `not`.", "a": "`a and b` er `True`, kun hvis både `a` og `b` er `True`.\n`a or b` er `True`, hvis mindst én af dem er `True`.\n`not a` er det modsatte af `a`."}, {"id": "branch.boolexp#3", "t": "branch.boolexp", "k": "p", "code": "x = 7\nprint(x > 5 and x < 10)", "a": "Begge sammenligninger er `True`, så hele udtrykket er `True`.", "out": "True", "run": 1}, {"id": "branch.boolexp#4", "t": "branch.boolexp", "k": "p", "code": "x = 12\nprint(x < 5 or x > 10)", "a": "Den første del er `False`, men den anden er `True`, og `or` kræver kun én.", "out": "True", "run": 1}, {"id": "branch.boolexp#5", "t": "branch.boolexp", "k": "p", "code": "a = True\nb = False\nprint(a and not b)", "a": "`not b` er `True`, og `True and True` er `True`.", "out": "True", "run": 1}, {"id": "branch.boolexp#6", "t": "branch.boolexp", "k": "o", "q": "Hvad betyder `0 <= nx < width`, og hvordan kan det skrives med `and`?", "a": "Det er en chained comparison, som tjekker, at `nx` ligger i intervallet fra og med 0 til (men ikke med) `width`. Det er det samme som `0 <= nx and nx < width`. Man bruger det fx til at tjekke, at en nabo ligger inden for et grid."}, {"id": "branch.boolexp#7", "t": "branch.boolexp", "k": "p", "code": "x = 5\nprint(0 <= x < 5)", "a": "`0 <= 5` er `True`, men `5 < 5` er `False`, så det samlede udtryk er `False`.", "out": "False", "run": 1}, {"id": "branch.boolexp#8", "t": "branch.boolexp", "k": "m", "q": "Hvornår er `a or b` lig `False`?", "a": "`or` er `True`, så snart én af siderne er `True`.", "opts": ["Kun når både `a` og `b` er `False`", "Når mindst én af dem er `False`", "Når `a` er `False`", "Aldrig"]}, {"id": "branch.boolexp#9", "t": "branch.boolexp", "k": "m", "q": "Hvornår er `a and b` lig `True`?", "a": "`and` kræver, at begge sider er `True`.", "opts": ["Kun når både `a` og `b` er `True`", "Når mindst én af dem er `True`", "Når `a` er `True`", "Altid"]}, {"id": "branch.boolexp#10", "t": "branch.boolexp", "k": "p", "code": "print(True or False and False)", "a": "`and` regnes før `or`, så udtrykket læses som `True or (False and False)`.", "out": "True", "run": 1}, {"id": "branch.boolexp#11", "t": "branch.boolexp", "k": "p", "code": "x = 5\nif x == 1 or 2:\n    print(\"ja\")\nelse:\n    print(\"nej\")", "a": "En klassisk fejl. Python læser det som `(x == 1) or (2)`, og tallet `2` er truthy, så betingelsen er altid `True`. Man skal skrive `x == 1 or x == 2`.", "out": "ja", "run": 1}, {"id": "branch.boolexp#12", "t": "branch.boolexp", "k": "c", "q": "Skriv en function `inside(x, y, width, height)`, der returnerer `True`, hvis cellen `(x, y)` ligger inden for et grid med den givne bredde og højde. Gyldige værdier er `0` til og med `width - 1` og `0` til og med `height -
